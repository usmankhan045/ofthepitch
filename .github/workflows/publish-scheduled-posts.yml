name: Publish scheduled posts

# Drip-publishes queued articles on their scheduled time (see
# content-queue/schedule.json). The publisher is idempotent: it only inserts
# posts whose scheduled time has passed and that are not already in the
# database, so re-runs and delayed or overlapping runs are safe.
#
# The cron runs every 30 minutes rather than once at the publish time. GitHub's
# scheduler is best-effort and often runs late, so a once-a-day tick aimed at
# the exact publish minute can miss and leave a post waiting a full day. A
# frequent tick means a delayed run simply catches up.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# Optional, to refresh the live site as soon as a post lands:
#   SITE_BASE_URL
#   REVALIDATION_SECRET

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (best-effort; catch-up is automatic)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would publish without inserting"
        type: boolean
        default: false

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish due posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: node scripts/publish-due-posts.mjs
